mfa.otp.help.title=OTP 2-Step verification method
mfa.otp.help.content=Domy\u015blnie oferowana jest weryfikacja dwuetapowa z u\u017cyciem aplikacji OTP (has\u0142o jednorazowe).<br/>U\u017cytkownicy, kt\u00f3rych to dotyczy, powinni wykona\u0107 nast\u0119puj\u0105ce kroki, aby potwierdzi\u0107 swoj\u0105 to\u017csamo\u015b\u0107:<br/>1- Zainstalowa\u0107 aplikacj\u0119 uwierzytelniaj\u0105c\u0105 (FreeOTP, Google authenticator), aby wygenerowa\u0107 tymczasowe i unikalne has\u0142o (OTP)<br/>2 - Zarejestrowa\u0107 zaufane urz\u0105dzenie w tej aplikacji<br/>3 - Po zarejestrowaniu zaufanego urz\u0105dzenia ka\u017cdy u\u017cytkownik b\u0119dzie musia\u0142 potwierdza\u0107 swoj\u0105 to\u017csamo\u015b\u0107 has\u0142em OTP wygenerowanym przez aplikacj\u0119.

mfa.otp.access.revocation.success=Your request has been sent successfully. It will be managed by an administrator
mfa.otp.access.revocation.warning=You have already sent a revocation request
