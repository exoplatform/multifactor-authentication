mfa.otp.help.title=Metodo d'attivazione OTP
mfa.otp.help.content=Di default, offriamo una verifica in 2 fasi con un'applicazione OTP (One-Time Password).<br/>Gli utenti interessati devono seguire i seguenti passaggi per confermare la propria identit\u00e0:<br/>1- Installare un'applicazione di autenticazione (FreeOTP, Google authenticator) per generare una password temporanea e unica (OTP).<br/>2 - Registrare il proprio dispositivo di fiducia da questa applicazione. <br/>3 - Una volta registrato il dispositivo di fiducia, ogni utente dovr\u00e0 confermare la propria identit\u00e0 recuperando l'OTP generato dall'applicazione.

