mfa.otp.help.title=OTP 2-Step verification method
mfa.otp.help.content=\u00cen mod implicit, oferim o verificare \u00een 2 pa\u0219i cu o aplica\u021bie OTP (One-Time Password, parol\u0103 unic\u0103).<br/>Utilizatorii viza\u021bi trebuie s\u0103 urmeze pa\u0219ii de mai jos pentru a-\u0219i confirma identitatea:<br/>1- Instala\u021bi o aplica\u021bie de autentificare (FreeOTP, Google Authenticator) pentru a genera o parol\u0103 temporar\u0103 \u0219i unic\u0103 (OTP)<br/>2 - \u00cenregistra\u021bi dispozitivul de \u00eencredere din aceast\u0103 aplica\u021bie<br/>3 - Dup\u0103 \u00eenregistrarea dispozitivului de \u00eencredere, fiecare utilizator va trebui s\u0103 \u00ee\u0219i confirme identitatea folosind parola OTP generat\u0103 de aplica\u021bie.

