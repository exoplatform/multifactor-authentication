mfa.otp.help.title=OTP 2-Step verification method
mfa.otp.help.content=\u30c7\u30d5\u30a9\u30eb\u30c8\u3067\u306f\u3001OTP (\u30ef\u30f3\u30bf\u30a4\u30e0\u30d1\u30b9\u30ef\u30fc\u30c9) \u30a2\u30d7\u30ea\u30b1\u30fc\u30b7\u30e7\u30f3\u306b\u3088\u308b 2 \u6bb5\u968e\u8a8d\u8a3c\u3092\u63d0\u4f9b\u3057\u3066\u3044\u307e\u3059\u3002<br/>\u5bfe\u8c61\u306e\u30e6\u30fc\u30b6\u30fc\u306f\u3001\u6b21\u306e\u624b\u9806\u3067\u672c\u4eba\u78ba\u8a8d\u3092\u884c\u3046\u5fc5\u8981\u304c\u3042\u308a\u307e\u3059:<br/>1 - \u8a8d\u8a3c\u30a2\u30d7\u30ea\u30b1\u30fc\u30b7\u30e7\u30f3 (FreeOTP\u3001Google Authenticator) \u3092\u30a4\u30f3\u30b9\u30c8\u30fc\u30eb\u3057\u3001\u4e00\u6642\u7684\u3067\u4e00\u610f\u306e\u30d1\u30b9\u30ef\u30fc\u30c9 (OTP) \u3092\u751f\u6210\u3057\u307e\u3059<br/>2 - \u3053\u306e\u30a2\u30d7\u30ea\u30b1\u30fc\u30b7\u30e7\u30f3\u304b\u3089\u4fe1\u983c\u3067\u304d\u308b\u7aef\u672b\u3092\u767b\u9332\u3057\u307e\u3059<br/>3 - \u4fe1\u983c\u3067\u304d\u308b\u7aef\u672b\u306e\u767b\u9332\u5f8c\u3001\u5404\u30e6\u30fc\u30b6\u30fc\u306f\u30a2\u30d7\u30ea\u30b1\u30fc\u30b7\u30e7\u30f3\u3067\u751f\u6210\u3055\u308c\u305f OTP \u3092\u5165\u529b\u3057\u3066\u672c\u4eba\u78ba\u8a8d\u3092\u884c\u3044\u307e\u3059\u3002

