mfa.otp.help.title=OTP 2-Step verification method
mfa.otp.help.content=Por predefini\u00e7\u00e3o, \u00e9 proposta uma verifica\u00e7\u00e3o em 2 passos com uma aplica\u00e7\u00e3o OTP (palavra-passe de utiliza\u00e7\u00e3o \u00fanica).<br/>Os utilizadores abrangidos devem seguir os passos seguintes para confirmar a sua identidade:<br/>1- Instalar uma aplica\u00e7\u00e3o de autentica\u00e7\u00e3o (FreeOTP, Google Authenticator) para gerar uma palavra-passe tempor\u00e1ria e \u00fanica (OTP)<br/>2 - Registar o seu dispositivo de confian\u00e7a a partir dessa aplica\u00e7\u00e3o<br/>3 - Depois de registado o dispositivo de confian\u00e7a, cada utilizador ter\u00e1 de confirmar a sua identidade introduzindo o OTP gerado pela aplica\u00e7\u00e3o.

