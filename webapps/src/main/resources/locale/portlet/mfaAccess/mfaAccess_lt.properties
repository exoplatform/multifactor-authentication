mfa.otp.help.title=OTP 2-Step verification method
mfa.otp.help.content=Pagal numatytuosius nustatymus si\u016blome dviej\u0173 veiksm\u0173 patvirtinim\u0105 su OTP programa (vienkartinis slapta\u017eodis).<br/>Susij\u0119 vartotojai, nor\u0117dami patvirtinti savo tapatyb\u0119, turi atlikti \u0161iuos veiksmus:<br/>1- \u012ediegti autentifikavimo program\u0105 (FreeOTP, Google authenticator), kuri generuoja laikin\u0105 ir unikal\u0173 slapta\u017eod\u012f (OTP)<br/>2 - U\u017eregistruoti savo patikim\u0105 \u012frengin\u012f \u0161ioje programoje<br/>3 - U\u017eregistravus patikim\u0105 \u012frengin\u012f, kiekvienas vartotojas tur\u0117s patvirtinti savo tapatyb\u0119 \u012fvesdamas programos sugeneruot\u0105 OTP.

