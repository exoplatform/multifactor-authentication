mfa.otp.help.title=OTP 2-Step verification method
mfa.otp.help.content=Som standard erbjuder vi tv\u00e5stegsverifiering med en OTP-app (eng\u00e5ngsl\u00f6senord).<br/>Ber\u00f6rda anv\u00e4ndare ska f\u00f6lja dessa steg f\u00f6r att bekr\u00e4fta sin identitet:<br/>1- Installera en autentiseringsapp (FreeOTP, Google Authenticator) som genererar ett tillf\u00e4lligt och unikt l\u00f6senord (OTP)<br/>2 - Registrera sin betrodda enhet fr\u00e5n den h\u00e4r appen<br/>3 - N\u00e4r den betrodda enheten har registrerats m\u00e5ste varje anv\u00e4ndare bekr\u00e4fta sin identitet med det OTP som appen genererar.

