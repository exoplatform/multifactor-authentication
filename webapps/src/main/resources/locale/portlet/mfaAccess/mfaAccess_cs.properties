mfa.otp.help.title=OTP 2-Step verification method
mfa.otp.help.content=Ve v\u00fdchoz\u00edm nastaven\u00ed nab\u00edz\u00edme dvouf\u00e1zov\u00e9 ov\u011b\u0159en\u00ed pomoc\u00ed aplikace OTP (jednor\u00e1zov\u00e9 heslo).<br/>Dot\u010den\u00ed u\u017eivatel\u00e9 by m\u011bli p\u0159i potvrzen\u00ed sv\u00e9 identity postupovat podle t\u011bchto krok\u016f:<br/>1- Nainstalujte si ov\u011b\u0159ovac\u00ed aplikaci (FreeOTP, Google Authenticator), kter\u00e1 generuje do\u010dasn\u00e9 a jedine\u010dn\u00e9 heslo (OTP)<br/>2 - V t\u00e9to aplikaci zaregistrujte sv\u00e9 d\u016fv\u011bryhodn\u00e9 za\u0159\u00edzen\u00ed<br/>3 - Po registraci d\u016fv\u011bryhodn\u00e9ho za\u0159\u00edzen\u00ed bude ka\u017ed\u00fd u\u017eivatel potvrzovat svou identitu zad\u00e1n\u00edm OTP vygenerovan\u00e9ho aplikac\u00ed.

mfa.otp.access.revocation.success=Your request has been sent successfully. It will be managed by an administrator
mfa.otp.access.revocation.warning=You have already sent a revocation request
