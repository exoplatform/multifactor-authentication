mfa.otp.help.title=OTP 2-Step verification method
mfa.otp.help.content=\u9ed8\u8ba4\u60c5\u51b5\u4e0b\uff0c\u6211\u4eec\u63d0\u4f9b\u4f7f\u7528 OTP \u5e94\u7528\u7a0b\u5e8f\uff08\u4e00\u6b21\u6027\u5bc6\u7801\uff09\u7684\u4e24\u6b65\u9a8c\u8bc1\u3002<br/>\u53d7\u5f71\u54cd\u7684\u7528\u6237\u5e94\u6309\u7167\u4ee5\u4e0b\u6b65\u9aa4\u786e\u8ba4\u5176\u8eab\u4efd\uff1a<br/>1- \u5b89\u88c5\u8eab\u4efd\u9a8c\u8bc1\u5668\u5e94\u7528\u7a0b\u5e8f\uff08FreeOTP\u3001Google \u8eab\u4efd\u9a8c\u8bc1\u5668\uff09\u4ee5\u751f\u6210\u4e34\u65f6\u552f\u4e00\u5bc6\u7801\uff08OTP\uff09<br/>2 - \u4ece\u6b64\u5e94\u7528\u7a0b\u5e8f\u6ce8\u518c\u5176\u53d7\u4fe1\u4efb\u7684\u8bbe\u5907<br/>3 - \u6ce8\u518c\u5176\u53d7\u4fe1\u4efb\u7684\u8bbe\u5907\u540e\uff0c\u6bcf\u4e2a\u7528\u6237\u90fd\u5fc5\u987b\u901a\u8fc7\u68c0\u7d22\u5e94\u7528\u7a0b\u5e8f\u751f\u6210\u7684 OTP \u6765\u786e\u8ba4\u5176\u8eab\u4efd\u3002

