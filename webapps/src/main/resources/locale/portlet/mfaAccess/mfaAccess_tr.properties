mfa.otp.help.title=OTP 2 Ad\u0131ml\u0131 do\u011frulama y\u00f6ntemi
mfa.otp.help.content=Varsay\u0131lan olarak, bir OTP uygulamas\u0131 (Tek Kullan\u0131ml\u0131k Parola) ile 2 Ad\u0131ml\u0131 do\u011frulama sunuyoruz.<br/>\u0130lgili kullan\u0131c\u0131lar\u0131n kimliklerini do\u011frulamak i\u00e7in a\u015fa\u011f\u0131daki ad\u0131mlar\u0131 izlemesi gerekir:<br/>1- Ge\u00e7ici ve benzersiz bir parola (OTP) olu\u015fturmak i\u00e7in bir kimlik do\u011frulama uygulamas\u0131 (FreeOTP, Google authenticator) y\u00fckleyin<br/>2 - G\u00fcvenilir cihaz\u0131n\u0131z\u0131 bu uygulamadan kaydedin<br/>3 - G\u00fcvenilir cihaz kaydedildikten sonra her kullan\u0131c\u0131, uygulaman\u0131n olu\u015fturdu\u011fu OTP'yi alarak kimli\u011fini do\u011frulamak zorunda kalacak.

